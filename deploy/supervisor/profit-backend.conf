[program:profit-backend]
command=/home/ubuntu/pro-fit-app/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/home/ubuntu/pro-fit-app/backend
user=ubuntu
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/profit-backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/home/ubuntu/pro-fit-app/venv/bin:%(ENV_PATH)s"
